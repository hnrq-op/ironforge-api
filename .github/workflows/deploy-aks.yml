name: Build & Deploy IronForge (ACR + AKS)

on:
  workflow_dispatch:
    inputs:
      ingress_ip:
        description: "IP público do NGINX Ingress gerado no AKS (ex: 20.195.10.25)"
        required: true
        type: string
      skip_build:
        description: "Pular build das imagens Docker e aplicar apenas Helm/K8s"
        required: false
        default: false
        type: boolean

env:
  ACR_NAME: ironforgeacrhnq26
  ACR_LOGIN_SERVER: ironforgeacrhnq26.azurecr.io
  RESOURCE_GROUP: ironforge-rg
  AKS_CLUSTER_NAME: ironforge-aks

jobs:
  # =========================================================================
  # FASE 1 (CI): Compila os 6 microsserviços em paralelo e envia para o ACR
  # =========================================================================
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - clientes
          - faturamento
          - gateway
          - logistica
          - pedidos
          - produtos

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login no Azure Container Registry (ACR)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./ironforge-${{ matrix.service }}
          file: ./ironforge-${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ironforge-${{ matrix.service }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/ironforge-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # =========================================================================
  # FASE 2 (CD): Configura o INGRESS_IP, instala os Charts Helm e aplica K8s
  # =========================================================================
  deploy-aks:
    name: Deploy no AKS
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Conectar ao cluster AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Injetar o IP público do Ingress nos manifestos
        run: |
          IP="${{ inputs.ingress_ip }}"
          sed -i "s/INGRESS_IP/${IP}/g" ironforge-infra/k8s/charts/ironforge-microservice/environments/values-gateway.yaml
          sed -i "s/INGRESS_IP/${IP}/g" ironforge-infra/k8s/charts/ironforge-microservice/environments/values-faturamento.yaml
          sed -i "s/INGRESS_IP/${IP}/g" ironforge-infra/k8s/ingress/ironforge-ingress.yaml

      - name: Deploy dos 6 microsserviços via Helm
        run: |
          CHART_DIR="./ironforge-infra/k8s/charts/ironforge-microservice"
          for svc in clientes faturamento gateway logistica pedidos produtos; do
            echo ">>> Instalando/Atualizando ironforge-${svc}..."
            helm upgrade --install "ironforge-${svc}" "${CHART_DIR}" \
              -f "${CHART_DIR}/environments/values-${svc}.yaml" \
              --wait --timeout 3m
          done

      - name: Aplicar Ingress, KEDA e ServiceMonitor
        run: |
          kubectl apply -f ironforge-infra/k8s/ingress/
          kubectl apply -f ironforge-infra/k8s/keda/
          kubectl apply -f ironforge-infra/k8s/monitoring/

      - name: Resumo das URLs de acesso
        run: |
          IP="${{ inputs.ingress_ip }}"
          echo "### Deploy concluído com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Swagger UI / API:** http://api.${IP}.nip.io/swagger-ui.html" >> $GITHUB_STEP_SUMMARY
          echo "- **Grafana:** http://grafana.${IP}.nip.io" >> $GITHUB_STEP_SUMMARY