server:
  port: 8083

spring:
  application:
    name: ironforge-pedidos
  aop:
    proxy-target-class: true
  datasource:
    url: jdbc:h2:mem:bancotest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri: http://localhost:8080/realms/test/protocol/openid-connect/certs
      client:
        registration:
          ironforge-pedidos-service:
            provider: keycloak
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/test/protocol/openid-connect/token
  kafka:
    listener:
      auto-startup: false

management:
  health:
    db:
      enabled: false
    kafka:
      enabled: false