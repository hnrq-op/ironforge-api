version: '3.9'

services:
  minio:
    image: minio/minio:latest
    container_name: ironforge-minio
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    volumes:
      - ./docs:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    restart: unless-stopped