---
- name: Atualizar cache de pacotes APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar pacotes utilitários e firewall UFW
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
    state: present

- name: Configurar política padrão do UFW (bloquear entrada)
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Liberar acesso SSH no UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Liberar portas dos serviços internos apenas para a VNet da Azure
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: "{{ vnet_cidr }}"
  loop:
    - "5432"
    - "8080"
    - "9000"
    - "9001"
    - "9092"

- name: Habilitar firewall UFW
  community.general.ufw:
    state: enabled