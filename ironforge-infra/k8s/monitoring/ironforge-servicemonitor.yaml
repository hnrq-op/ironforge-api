apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ironforge-microservices-monitor
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ironforge
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s