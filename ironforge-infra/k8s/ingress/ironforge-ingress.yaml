apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ironforge-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.INGRESS_IP.nip.io
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: ironforge-keycloak-bridge
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: ironforge-keycloak-bridge
                port:
                  number: 8080
          - path: /ironforge-faturas
            pathType: Prefix
            backend:
              service:
                name: ironforge-minio-bridge
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ironforge-gateway
                port:
                  number: 8080
    - host: grafana.INGRESS_IP.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80