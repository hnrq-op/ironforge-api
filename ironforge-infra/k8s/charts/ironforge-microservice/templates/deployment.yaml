apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ironforge-microservice.fullname" . }}
  labels:
    {{- include "ironforge-microservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ironforge-microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ironforge-microservice.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: {{ .Values.jvmOptions | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "ironforge-microservice.fullname" . }}-config
            - secretRef:
            name: {{ include "ironforge-microservice.fullname" . }}-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3