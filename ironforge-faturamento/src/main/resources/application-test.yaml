server:
  port: 8084

spring:
  application:
    name: ironforge-faturamento
  aop:
    proxy-target-class: true
  datasource:
    url: jdbc:h2:mem:bancotest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    kafka:
      listener:
        auto-startup: false

management:
  health:
    db:
      enabled: false
    kafka:
      enabled: false