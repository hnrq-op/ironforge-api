server:
  port: 8081

spring:
  application:
    name: ironforge-produtos

  datasource:
    url: jdbc:h2:mem:bancotest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true