server:
  port: 8081

spring:
  application:
    name: ironforge-produtos
  aop:
    proxy-target-class: true
  datasource:
    url: jdbc:h2:mem:bancotest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri: http://localhost:8080/realms/test/protocol/openid-connect/certs

management:
  health:
    db:
      enabled: false
