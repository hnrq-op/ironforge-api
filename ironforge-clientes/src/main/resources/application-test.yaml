server:
  port: 8082

spring:
  application:
    name: ironforge-clientes

  aop:
    proxy-target-class: true

  datasource:
    url: jdbc:h2:mem:bancotest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true