server:
  port: 8082

spring:
  application:
    name: ironforge-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/ironforge_clientes
    username: ironforgeadmin
    password: ironforge123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ironforge-realm